<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EvoFarmer - Field Profiles</title>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <link href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .sidebar-link.active { 
            background-color: rgba(34, 197, 94, 0.1);
            border-left: 4px solid #22c55e;
        }
        #map { height: 300px; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="hidden md:flex md:flex-shrink-0">
            <div class="flex flex-col w-64 bg-white border-r border-gray-200">
                <div class="flex items-center justify-center h-16 px-4 border-b">
                    <h1 class="text-xl font-bold text-green-600">EvoFarmer</h1>
                </div>
                <nav class="flex-1 px-2 py-4 space-y-1">
                    <a href="#" class="flex items-center px-4 py-2 text-gray-600 sidebar-link">
                        <i class="bi bi-speedometer2 mr-3"></i> Dashboard
                    </a>
                    <a href="#" class="flex items-center px-4 py-2 text-gray-600 sidebar-link">
                        <i class="bi bi-plant mr-3"></i> Crops
                    </a>
                    <a href="#" class="flex items-center px-4 py-2 text-green-600 sidebar-link active">
                        <i class="bi bi-geo-alt mr-3"></i> Fields
                    </a>
                    <a href="#" class="flex items-center px-4 py-2 text-gray-600 sidebar-link">
                        <i class="bi bi-box mr-3"></i> Resources
                    </a>
                    <a href="#" class="flex items-center px-4 py-2 text-gray-600 sidebar-link">
                        <i class="bi bi-list-check mr-3"></i> Tasks
                    </a>
                    <a href="#" class="flex items-center px-4 py-2 text-gray-600 sidebar-link">
                        <i class="bi bi-calculator mr-3"></i> Accounting
                    </a>
                    <a href="#" class="flex items-center px-4 py-2 text-gray-600 sidebar-link">
                        <i class="bi bi-file-earmark-text mr-3"></i> Reports
                    </a>
                    <a href="#" class="flex items-center px-4 py-2 text-gray-600 sidebar-link">
                        <i class="bi bi-gear mr-3"></i> Configuration
                    </a>
                </nav>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="flex flex-col flex-1 overflow-hidden">
            <!-- Top Bar -->
            <header class="bg-white border-b border-gray-200">
                <div class="px-4 py-4 sm:px-6 lg:px-8">
                    <div class="flex items-center justify-between">
                        <h2 class="text-2xl font-bold text-gray-900">Field Profiles</h2>
                        <button onclick="showAddFieldModal()" class="px-4 py-2 text-white bg-green-600 rounded-lg hover:bg-green-700">
                            <i class="bi bi-plus"></i> Add New Field
                        </button>
                    </div>
                    <!-- Filters -->
                    <div class="flex flex-wrap gap-4 mt-4">
                        <input type="text" placeholder="Search field name..." class="px-4 py-2 border rounded-lg">
                        <select class="px-4 py-2 border rounded-lg">
                            <option>All Crops</option>
                            <option>Wheat</option>
                            <option>Corn</option>
                            <option>Soybeans</option>
                        </select>
                        <select class="px-4 py-2 border rounded-lg">
                            <option>All Teams</option>
                            <option>Team A</option>
                            <option>Team B</option>
                            <option>Team C</option>
                        </select>
                    </div>
                </div>
            </header>

            <!-- Field Cards -->
            <main class="flex-1 overflow-y-auto p-6">
                <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
                    <!-- Sample Field Card -->
                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-lg font-semibold">North Field</h3>
                            <span class="px-2 py-1 text-sm text-green-700 bg-green-100 rounded-full">Active</span>
                        </div>
                        <div class="space-y-2">
                            <p class="text-gray-600"><i class="bi bi-arrows-angle-expand mr-2"></i>2.5 acres</p>
                            <p class="text-gray-600"><i class="bi bi-geo mr-2"></i>West Region</p>
                            <p class="text-gray-600"><i class="bi bi-layers mr-2"></i>Loamy Soil</p>
                            <p class="text-gray-600"><i class="bi bi-plant mr-2"></i>Wheat</p>
                            <p class="text-gray-600"><i class="bi bi-people mr-2"></i>Team A</p>
                        </div>
                        <div class="flex gap-2 mt-4">
                            <button onclick="viewField(1)" class="px-3 py-1 text-sm text-blue-600 bg-blue-50 rounded hover:bg-blue-100">View</button>
                            <button onclick="editField(1)" class="px-3 py-1 text-sm text-green-600 bg-green-50 rounded hover:bg-green-100">Edit</button>
                            <button onclick="archiveField(1)" class="px-3 py-1 text-sm text-red-600 bg-red-50 rounded hover:bg-red-100">Archive</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Add/Edit Field Modal -->
    <div id="fieldModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full">
        <div class="relative top-20 mx-auto p-5 border w-full max-w-4xl shadow-lg rounded-md bg-white">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-bold">Add New Field</h3>
                <button onclick="closeFieldModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <form id="fieldForm" class="space-y-6">
                <!-- Basic Details -->
                <div class="space-y-4">
                    <h4 class="font-semibold">Basic Details</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Field Name</label>
                            <input type="text" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Size (acres)</label>
                            <input type="number" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Location</label>
                        <div id="map" class="mt-1 rounded-lg"></div>
                    </div>
                </div>

                <!-- Soil & Crop History -->
                <div class="space-y-4">
                    <h4 class="font-semibold">Soil & Crop History</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Soil Type</label>
                            <select class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500">
                                <option>Sandy</option>
                                <option>Clay</option>
                                <option>Loamy</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Soil Quality Notes</label>
                            <textarea class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Team Assignment -->
                <div class="space-y-4">
                    <h4 class="font-semibold">Team & Crop Assignment</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Assign Crop</label>
                            <select class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500">
                                <option>Wheat</option>
                                <option>Corn</option>
                                <option>Soybeans</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Assign Team</label>
                            <select class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500">
                                <option>Team A</option>
                                <option>Team B</option>
                                <option>Team C</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="flex justify-end space-x-3">
                    <button type="button" onclick="closeFieldModal()" class="px-4 py-2 text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-white bg-green-600 rounded-lg hover:bg-green-700">Save Field</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Initialize map
        let map;
        
        function initMap() {
            map = L.map('map').setView([51.505, -0.09], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
        }

        // Modal functions
        function showAddFieldModal() {
            document.getElementById('fieldModal').classList.remove('hidden');
            setTimeout(() => {
                initMap();
            }, 100);
        }

        function closeFieldModal() {
            document.getElementById('fieldModal').classList.add('hidden');
        }

        function viewField(id) {
            alert('Viewing field ' + id);
        }

        function editField(id) {
            showAddFieldModal();
        }

        function archiveField(id) {
            if(confirm('Are you sure you want to archive this field?')) {
                alert('Field archived');
            }
        }

        // Form submission
        document.getElementById('fieldForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Field saved successfully!');
            closeFieldModal();
        });

        // Mobile menu toggle
        function toggleMobileMenu() {
            const sidebar = document.querySelector('aside');
            sidebar.classList.toggle('hidden');
        }
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
